apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yoyo-edge-ingress
  namespace: yoyo-system
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - yoyo.ai
        - api.yoyo.ai
      secretName: yoyo-tls-certs
  rules:
    - host: yoyo.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yoyo-frontend-svc
                port:
                  number: 3000
    - host: api.yoyo.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yoyo-backend-svc
                port:
                  number: 4000

