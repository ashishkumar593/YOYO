apiVersion: v1
kind: Service
metadata:
  name: yoyo-redis
  namespace: yoyo-system
  labels:
    app: yoyo-redis
spec:
  ports:
    - port: 6379
      name: redis
  selector:
    app: yoyo-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yoyo-redis
  namespace: yoyo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yoyo-redis
  template:
    metadata:
      labels:
        app: yoyo-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "4gb", "--maxmemory-policy", "allkeys-lru"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: redis-storage
              mountPath: /data
      volumes:
        - name: redis-storage
          emptyDir: {}

