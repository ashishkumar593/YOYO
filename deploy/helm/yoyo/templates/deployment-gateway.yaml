apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yoyo.fullname" . }}-gateway
  labels:
    {{- include "yoyo.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "yoyo.name" . }}-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "yoyo.name" . }}-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.gateway.env.PORT }}"
            - name: NODE_ENV
              value: "{{ .Values.gateway.env.NODE_ENV }}"
            - name: FEATURE_MOCK_INFERENCE
              value: "{{ .Values.gateway.env.FEATURE_MOCK_INFERENCE }}"
            - name: FEATURE_WORKER_HEALTHCHECK
              value: "{{ .Values.gateway.env.FEATURE_WORKER_HEALTHCHECK }}"
            - name: WORKER_HEALTH_INTERVAL_MS
              value: "{{ .Values.gateway.env.WORKER_HEALTH_INTERVAL_MS }}"
            - name: REDIS_URL
              value: "{{ .Values.gateway.env.REDIS_URL }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "yoyo.fullname" . }}-secrets
                  key: jwtSecret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "yoyo.fullname" . }}-secrets
                  key: databaseUrl
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
