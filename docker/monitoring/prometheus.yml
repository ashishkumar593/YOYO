global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "yoyo-api-gateway"
    static_configs:
      - targets: ["api:4000"]
    metrics_path: "/metrics"

  - job_name: "ollama-gpu-workers"
    static_configs:
      - targets: ["ollama-worker-gpu0:11434", "ollama-worker-gpu1:11434"]
    metrics_path: "/api/version"
